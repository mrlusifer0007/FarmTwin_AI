services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: agritwin
      POSTGRES_PASSWORD: agritwin
      POSTGRES_DB: agritwin
    ports:
      - "5432:5432"
    volumes:
      - agritwin_pgdata:/var/lib/postgresql/data

volumes:
  agritwin_pgdata:
